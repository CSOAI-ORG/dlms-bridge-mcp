[project]
name = "dlms-bridge-mcp"
version = "0.1.0"
description = "Bridge DLMS/COSEM smart-meter + energy data to ONE OS — parse, map, govern (IEC 62056 / NIS2 / GDPR). CSOAI Layer-0 legacy-bridge family."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "CSOAI-ORG"}]
dependencies = ["mcp>=1.0.0", "pydantic>=2.0.0"]
[project.scripts]
dlms-bridge-mcp = "server:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
